[package]
name = "garden"
version = "0.1.0"
authors = ["Christopher Biscardi <chris@christopherbiscardi.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.51", features = ["env", "derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
directories = "6.0.0"
edit = "0.1.5"
rprompt = "2.2"
slug = "0.1.6"
owo-colors = { version = "4.2.3", features = ["supports-colors"] }
thiserror = "2.0.17"
tempfile = "3.23.0"

[dev-dependencies]
assert_cmd = "2.1.1"
assert_fs = "1.1.3"
predicates = "3.1.3"
rexpect = "0.6.2"
